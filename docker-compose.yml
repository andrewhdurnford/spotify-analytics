services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./data:/data
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET}
      - SPOTIFY_REFRESH_TOKEN=${SPOTIFY_REFRESH_TOKEN}
      - CRON_SECRET=${CRON_SECRET}
      - ENABLE_LOCAL_SYNC=${ENABLE_LOCAL_SYNC:-false}
      - LOCAL_SYNC_INTERVAL_SECONDS=${LOCAL_SYNC_INTERVAL_SECONDS:-30}
      - SYNC_MAX_WAIT_SECONDS=${SYNC_MAX_WAIT_SECONDS:-25}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      target: deps
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - API_URL=http://backend:8000
    command: npm run dev
