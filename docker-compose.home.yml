# Home-server deployment: primary backend, exposed through the host's
# Cloudflare Tunnel and the shared Caddy proxy (deploy/home/caddy) at
# api.<domain>/spotify. Render + Supabase stay up as the standby. The database
# lives in the shared Postgres instance (deploy/home/postgres), reached over
# the `pg` network. Setup and day-to-day commands: deploy/home/README.md
#
#   docker compose -f docker-compose.home.yml --env-file .env.home up -d --build

name: spotify-home

services:
  backend:
    build: ./backend
    restart: unless-stopped
    networks:
      default:
      pg:
      proxy:
        # The name Caddy proxies to; must be unique across apps on `proxy`.
        aliases:
          - spotify-api
    # No published ports: only Caddy reaches the backend.
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env.home}
      # The shared instance is only reachable on the private `pg` network.
      DATABASE_REQUIRE_SSL: "false"
      BACKUP_DATABASE_URL: ${BACKUP_DATABASE_URL:?set BACKUP_DATABASE_URL in .env.home}
      ENVIRONMENT: production
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?set ALLOWED_HOSTS in .env.home}
      # Safe because the only client that can connect is Caddy, which sets
      # X-Forwarded-For from Cloudflare's Cf-Connecting-IP.
      FORWARDED_ALLOW_IPS: "*"
      CRON_SECRET: ${CRON_SECRET:?set CRON_SECRET in .env.home}
      FRONTEND_URL: ${FRONTEND_URL:-https://spotify.andrewdurnford.com}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET}
      SPOTIFY_REFRESH_TOKEN: ${SPOTIFY_REFRESH_TOKEN}
      # The home server records plays itself from recently-played.
      ENABLE_LOCAL_SYNC: "true"
      LOCAL_SYNC_INTERVAL_SECONDS: ${LOCAL_SYNC_INTERVAL_SECONDS:-60}

  # psql/pg_dump for the deploy/home scripts; never started by `up`.
  # postgres:17 because pg_dump must be at least as new as Supabase's server.
  pgtools:
    image: postgres:17
    profiles: ["tools"]
    networks:
      - pg
    environment:
      DATABASE_URL: ${DATABASE_URL}
      BACKUP_DATABASE_URL: ${BACKUP_DATABASE_URL}

networks:
  pg:
    external: true
  proxy:
    external: true
