name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://test:test@localhost/test?sslmode=require
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: pytest

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --run

      - name: Build
        run: npm run build

  backend-docker-build:
    name: Backend Docker Build (Koyeb)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t backend-koyeb-check ./backend

  deploy-home:
    name: Deploy (home server)
    # Pushes to main only: this job runs on the home server's self-hosted
    # runner, which has Docker access, so it must never run PR code.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, backend-docker-build]
    runs-on: [self-hosted, ad-server-2005]
    concurrency:
      group: deploy-home
      cancel-in-progress: false
    steps:
      # Deploys from the long-lived checkout that holds .env.home, not the
      # runner's workspace; no actions/checkout needed.
      - name: Deploy
        run: ~/spotify-analytics/deploy/home/deploy.sh "$GITHUB_SHA"
